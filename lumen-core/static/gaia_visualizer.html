<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAIA Visualizer</title>
<style>body{font:14px system-ui;background:#10131a;color:#e7edf5;margin:0}header{padding:18px 24px;background:#171d28;display:flex;justify-content:space-between;align-items:center}main{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#171d28;border:1px solid #2a3547;border-radius:12px;padding:15px;min-height:120px}.state{font-size:28px;font-weight:700;color:#8ad0ff}.muted{color:#93a4b8}.ok{color:#7de2a8}.warn{color:#ffcf7d}.bad{color:#ff8a8a}pre{white-space:pre-wrap;max-height:260px;overflow:auto}input{background:#0d1118;color:white;border:1px solid #38475d;padding:8px;border-radius:6px;width:260px}button{background:#3178c6;color:white;border:0;border-radius:6px;padding:8px 12px;cursor:pointer}</style></head>
<body><header><div><strong>GAIA Visualizer</strong><div class="muted">Read-only client — authority remains in GAIA Core</div></div><div><input id="token" type="password" placeholder="diagnostics token"><button onclick="refresh()">Refresh</button></div></header>
<main><section class="card"><div class="muted">State</div><div id="state" class="state">CONNECTING</div><div id="health" class="muted"></div></section><section class="card"><div class="muted">Active plan / Skill / worker</div><pre id="plan">—</pre></section><section class="card"><div class="muted">Capabilities and backends</div><pre id="caps">—</pre></section><section class="card"><div class="muted">Memory / Browser / Voice</div><pre id="memory">—</pre></section><section class="card" style="grid-column:1/-1"><div class="muted">Event timeline</div><pre id="events"></pre></section></main>
<script>
const $ = id => document.getElementById(id);
const headers = () => { const t = $('token').value.trim(); return t ? {'Authorization':'Bearer '+t} : {}; };
let aborter = null;
async function refresh() {
  try {
    const r = await fetch('/api/platform/status', {headers:headers(), cache:'no-store'});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    $('state').textContent = d.started ? 'IDLE' : 'STOPPED';
    $('health').textContent = 'Event Bus '+JSON.stringify(d.event_bus||{});
    $('caps').textContent = JSON.stringify(d.capabilities||{},null,2);
    $('memory').textContent = JSON.stringify(d.backends||{},null,2);
    $('plan').textContent = JSON.stringify({skills:d.skills,projects:d.projects,jobs:d.jobs,breakers:d.breakers},null,2);
  } catch(e) { $('state').textContent='ERROR'; $('health').textContent=e.message; }
}
async function connect() {
  if(aborter) aborter.abort();
  const controller = new AbortController(); aborter = controller;
  try {
    // Native EventSource cannot attach Bearer headers. Do not put tokens in URLs.
    const r = await fetch('/api/visualizer/events', {headers:headers(),signal:controller.signal,cache:'no-store'});
    if (!r.ok) throw new Error('HTTP '+r.status);
    const reader = r.body.getReader(), decoder = new TextDecoder();
    let pending = '';
    while(true) {
      const chunk = await reader.read(); if(chunk.done) break;
      pending += decoder.decode(chunk.value,{stream:true});
      const frames = pending.split(/\r?\n\r?\n/); pending = frames.pop();
      for(const frame of frames) for(const line of frame.split(/\r?\n/)) {
        if(!line.startsWith('data:')) continue;
        const payload=line.slice(5).trim();
        $('events').textContent=(payload+'\n'+$('events').textContent).slice(0,12000);
        try { const obj=JSON.parse(payload); if(obj.state) $('state').textContent=obj.state; } catch(_) {}
      }
    }
  } catch(e) {
    if (!controller.signal.aborted) $('health').textContent='Events: '+e.message;
  }
  if (!controller.signal.aborted) setTimeout(()=>{if(aborter===controller)connect()},3000);
}
$('token').addEventListener('change',()=>{ refresh(); connect(); });
refresh(); connect();
</script></body></html>
